default:
  tags:
    - windows

stages:
  - test
  - build
  - deploy

# -----------------------------------------------------------------------------
# 1. TEST STAGE
# -----------------------------------------------------------------------------
test-backend:
  stage: test
  script:
    - Write-Host "Running Backend Python Routing Unit Tests..."
    - cd backend
    - python -m unittest discover -s routing -p "test_*.py"
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml

test-frontend:
  stage: test
  script:
    - Write-Host "Running Frontend TypeScript Type Checking..."
    - cd frontend
    - cmd /c "npx tsc --noEmit"
  rules:
    - changes:
        - frontend/**/*
        - .gitlab-ci.yml

# -----------------------------------------------------------------------------
# 2. BUILD STAGE
# -----------------------------------------------------------------------------
build-backend:
  stage: build
  needs: ["test-backend"]
  script:
    - Write-Host "Building & Validating Backend Python Modules..."
    - cd backend
    - python -m py_compile routing/dijkstra.py routing/risk_engine.py
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml

build-frontend:
  stage: build
  needs: ["test-frontend"]
  script:
    - Write-Host "Building React Production Distribution Bundle..."
    - cd frontend
    - cmd /c "npm install"
    - cmd /c "npm run build"
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 day
  rules:
    - changes:
        - frontend/**/*
        - .gitlab-ci.yml

# -----------------------------------------------------------------------------
# 3. DEPLOY STAGE
# -----------------------------------------------------------------------------
deploy-backend:
  stage: deploy
  needs: ["build-backend"]
  script:
    - Write-Host "Deploying Backend Lambdas & Infrastructure via Terraform..."
    - cd infrastructure
    - terraform init
    - terraform apply -auto-approve
  rules:
    - changes:
        - backend/**/*
        - infrastructure/**/*
        - .gitlab-ci.yml

deploy-frontend:
  stage: deploy
  needs: ["build-frontend"]
  script:
    - Write-Host "Deploying Frontend Assets to AWS S3 Website Bucket..."
    - aws s3 sync frontend/dist s3://logistics-control-tower-dev-frontend-597289949963 --delete
  rules:
    - changes:
        - frontend/**/*
        - .gitlab-ci.yml
