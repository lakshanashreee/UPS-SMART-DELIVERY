default:
  tags:
    - windows

stages:
  - test
  - build
  - deploy

# -----------------------------------------------------------------------------
# 1. TEST STAGE
# -----------------------------------------------------------------------------
test-backend:
  stage: test
  script:
    - Write-Host "Running Backend Python Routing Unit Tests..."
    - $env:PYTHONPATH="."
    - python -m unittest discover -s backend/routing -p "test_*.py"
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml

test-frontend:
  stage: test
  script:
    - Write-Host "Running Frontend TypeScript Type Checking..."
    - cd frontend
    - cmd /c "npm install"
    - cmd /c "npx tsc -b"
  rules:
    - changes:
        - frontend/**/*
        - .gitlab-ci.yml

# -----------------------------------------------------------------------------
# 2. BUILD STAGE
# -----------------------------------------------------------------------------
build-backend:
  stage: build
  needs: ["test-backend"]
  dependencies:
    - test-backend
  script:
    - Write-Host "Validating Backend Python Modules..."
    - $env:PYTHONPATH="."
    - python -m py_compile backend/routing/dijkstra.py backend/routing/risk_engine.py
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml

build-frontend:
  stage: build
  needs: ["test-frontend"]
  dependencies:
    - test-frontend
  script:
    - Write-Host "Building React Production Distribution Bundle..."
    - cd frontend
    - cmd /c "npm install"
    - cmd /c "npm run build"
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 day
  rules:
    - changes:
        - frontend/**/*
        - .gitlab-ci.yml

# -----------------------------------------------------------------------------
# 3. DEPLOY STAGE
# -----------------------------------------------------------------------------
deploy-backend:
  stage: deploy
  needs: ["build-backend"]
  dependencies:
    - build-backend
  script:
    - Write-Host "Deploying Backend Lambdas & Infrastructure via Terraform..."
    - if (Test-Path "C:/Users/Lakshana/.aws/credentials") { $env:AWS_SHARED_CREDENTIALS_FILE="C:/Users/Lakshana/.aws/credentials"; $env:AWS_CONFIG_FILE="C:/Users/Lakshana/.aws/config" }
    - $env:AWS_DEFAULT_REGION="us-east-1"
    - cd infrastructure
    - terraform init
    - terraform apply -auto-approve
  rules:
    - changes:
        - backend/**/*
        - infrastructure/**/*
        - .gitlab-ci.yml

deploy-frontend:
  stage: deploy
  needs: ["build-frontend"]
  dependencies:
    - build-frontend
  script:
    - Write-Host "Deploying Frontend Assets to AWS S3 Website Bucket..."
    - if (Test-Path "C:/Users/Lakshana/.aws/credentials") { $env:AWS_SHARED_CREDENTIALS_FILE="C:/Users/Lakshana/.aws/credentials"; $env:AWS_CONFIG_FILE="C:/Users/Lakshana/.aws/config" }
    - $env:AWS_DEFAULT_REGION="us-east-1"
    - if (-not (Test-Path "frontend/dist")) { cd frontend; cmd /c "npm install"; cmd /c "npm run build"; cd .. }
    - aws s3 sync frontend/dist s3://logistics-control-tower-dev-frontend-597289949963 --delete
  rules:
    - changes:
        - frontend/**/*
        - .gitlab-ci.yml
